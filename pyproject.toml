[project]
name = "hydra-structlog"
version = "1.0.0"
description = "An opinionated hydra plugin to configure logging with structlog"
readme = "README.md"
authors = [
    {name = "Sören Zapp"},
]
keywords = ["hydra", "structlog", "plugin", "hydra-zen"]
license = 'MIT'
license-files = ['LICENSE']
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.2",
    "structlog>=25.5.0",
]

[project.urls]
Source = 'https://github.com/szapp/hydra-structlog'
Issues = 'https://github.com/szapp/hydra-structlog/issues'
Funding = 'https://ko-fi.com/szapp'

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty>=0.0.26",
    "interrogate>=1.7.0",
    "prek>=0.3.8",
    "nox>=2026.2.9",
]
tests = [
    "dirty-equals>=0.11",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.0.1",
]
examples = [
    "hydra-zen>=0.16.0",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "tqdm>=4.67.3",
]

[tool.uv]
default-groups = [
    "dev",
    "tests",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hydra_plugins.hydra_structlog", "hydra_structlog"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I",     # organize-imports
    "E501",  # line-too-long
    "UP006", # non-pep585-annotation
    "UP035", # deprecated-import
    "D200",  # unnecessary-multiline-docstring
    "D209",  # new-line-after-last-paragraph
    "D210",  # surrounding-whitespace
    "D212",  # multi-line-summary-first-line
    "D403",  # first-word-capitalized
    "D405",  # non-capitalized-section-name
    "D416",  # missing-section-name-colon
]
ignore = [
    "E731", # lambda-assignment
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/test_*.py" = ["S101"] # assert

[tool.ruff.format]
line-ending = "lf"

[[tool.ty.overrides]]
include = ["src/hydra_structlog/handlers.py"]

[tool.ty.overrides.rules]
unused-type-ignore-comment = "ignore"

[tool.pytest]
strict_xfail = true # Error on successful tests that should fail
addopts = [
    "-ra",                     # More insights
    "-vv",                     # Show parametrized test names
    "-p",
    "no:tach",                 # Skipping tests skews coverage
    "--strict-markers",        # Prevent silent bugs
    "--strict-config",         # Report errors in config
    "--doctest-modules",       # Test code examples in doc strings
    "--cov",                   # Report coverage by default
    "--import-mode=importlib", # Prevent importing from local src
]
testpaths = ["tests", "src"] # Speed up collection; include src for doctest

[tool.coverage.run]
source = [
    "src",
    "tests", # Spot outdated tests
]
branch = true

[tool.coverage.report]
fail_under = 100     # Clean coverage. Use `#pragma: no cover` to skip coverage.
ignore_errors = true
show_missing = true
skip_covered = true
skip_empty = true

[tool.interrogate]
omit-covered-files = true
verbose = 2
fail-under = 100
whitelist-regex = ["test_.*"]
exclude = ["*.cache"]
style = "google"
